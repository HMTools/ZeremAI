<style>
  /* Layout: a title and one line of facts, then the steps as a runbook or as two lanes, with a quiet side panel for the picked step. Colour: white and Claude orange. A bar at the bottom, only for an answer. */
  :root {
    --bg: #ffffff; --surface: #ffffff; --fg: #141413; --muted: #6b6a63; --line: #ecebe6; --line2: #d6d4cc; --hover: #f8f7f3; --sel: #fdf0e9;

  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1f1e1d; --surface: #2a2927; --fg: #f0eee6; --muted: #a8a69c; --line: #3a3834; --line2: #55524b; --hover: #32302d; --sel: #3a3834;
    --accent: #e8845f; --accent-text: #e8845f; --accent-bg: #4a2e23; --ink: #f0eee6; --on-ink: #1f1e1d; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #1f1e1d; --surface: #2a2927; --fg: #f0eee6; --muted: #a8a69c; --line: #3a3834; --line2: #55524b; --hover: #32302d; --sel: #3a3834;
    --accent: #e8845f; --accent-text: #e8845f; --accent-bg: #4a2e23; --ink: #f0eee6; --on-ink: #1f1e1d; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); padding-inline: 16px; padding-block: 28px 0; }
  .wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 22px; }
  h1, h3, h4, p { margin: 0; } h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.015em; text-wrap: balance; font-weight: 650; }
  h4 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
  button { font: inherit; color: inherit; cursor: pointer; } :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .link { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 550; text-align: left; } .link:hover { text-decoration: underline; }

  /* header */
  .head { display: grid; gap: 6px; }
  .facts { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .purpose { max-width: 74ch; color: var(--muted); padding-top: 6px; }
  .vt { margin-left: auto; display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; } .vt button { background: none; border: 0; padding: 3px 12px; font-size: 13px; font-weight: 550; color: var(--muted); }
  .vt button + button { border-left: 1px solid var(--line2); } .vt button[aria-pressed="true"] { background: var(--sel); color: var(--fg); }


  /* shell */
  .shell { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .shell { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .side { position: sticky; top: 12px; max-height: calc(100vh - 96px); overflow: auto; } .backbtn { display: none; } }

  /* the steps */
  .list { padding-bottom: 12px; }
  .dcrumb { display: flex; gap: 6px; align-items: center; padding: 0 0 10px; font-size: 13.5px; color: var(--muted); }
  .fwrow { padding: 18px 0 0; color: var(--muted); font-size: 13.5px; }
  /* runbook: a page of type */
  .rb { font-family: "Newsreader", Georgia, serif; max-width: 600px; }
  .rb .part { margin: 22px 0 2px; font: 700 11px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); border-bottom: 1px solid var(--ink); padding-bottom: 6px; } .rb .part:first-child { margin-top: 0; }
  .rb .st { display: grid; grid-template-columns: 32px minmax(0, 1fr); padding: 8px 10px 3px 0; cursor: pointer; border-radius: 8px; } .rb .st:hover { background: var(--hover); } .rb .st[aria-pressed="true"] { background: var(--sel); }
  .rb .no { text-align: right; padding-right: 10px; font-size: 16px; line-height: 1.4; color: var(--muted); font-variant-numeric: lining-nums; }
  .rb .st b { font-size: 16.5px; font-weight: 600; line-height: 1.3; display: block; } .rb .st p { font-size: 14.5px; line-height: 1.4; color: var(--muted); margin-top: 1px; }
  .rb .stop { margin: 5px 0 2px 32px; border: 1px solid var(--accent-text); color: var(--accent-text); padding: 3px 9px; font: 700 10.5px var(--font-body); letter-spacing: .06em; text-transform: uppercase; display: inline-block; }
  .rb .nt { margin: 3px 0 0 32px; font-style: italic; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .rb .nt button { font: inherit; font-style: italic; background: none; border: 0; padding: 0; color: var(--accent-text); text-decoration: underline; cursor: pointer; }
  .rb .kids { margin: 6px 0 6px 32px; padding-left: 12px; border-left: 1px solid var(--line2); } .rb .kids .st { grid-template-columns: 26px minmax(0, 1fr); } .rb .kids .st b { font-size: 15px; } .rb .kids .st p { font-size: 13.5px; } .rb .kids .no { font-size: 14px; } .rb .kids .stop, .rb .kids .nt { margin-left: 26px; }
  /* two lanes: Claude on the left, you on the right, time running down */
  .lanes { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 10px 6px 4px; } .lanes svg { display: block; width: 100%; height: auto; }
  .lp { cursor: pointer; } .lp rect { fill: var(--surface); stroke: var(--line2); stroke-width: 1.4; } .lp.you rect { fill: var(--accent-bg); stroke: var(--accent); } .lp:hover rect { stroke: var(--muted); } .lp.you:hover rect { stroke: var(--accent-text); }
  .lp.sel rect { stroke: var(--accent); stroke-width: 2.6; } .lp:focus-visible rect { stroke: var(--accent); stroke-width: 2.6; }
  .lp text { fill: var(--fg); font-family: var(--font-body); font-size: 13.5px; font-weight: 600; } .lp text.lnu { fill: var(--muted); font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; }
  .lnt { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; } .lph { fill: var(--muted); font-family: var(--font-body); font-size: 12px; font-weight: 600; }
  .lw { fill: none; stroke: var(--line2); stroke-width: 1.4; } .lw.you { stroke: var(--accent); opacity: .7; } .lmid { stroke: var(--line); stroke-dasharray: 3 5; }
  .lhd { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; } .lhd.c { fill: var(--muted); } .lhd.u { fill: var(--accent-text); }
  

  /* side panel */
  .side { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 10px; gap: 4px; overflow-x: auto; }
  .tabs button { background: none; border: 0; padding: 14px 8px 11px; font-weight: 550; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .pane { padding: 18px; display: grid; gap: 18px; }
  .pnav { display: flex; align-items: center; gap: 8px; } .pnav .arrows { margin-left: auto; display: inline-flex; gap: 4px; }
  .pnav .arrows button { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line2); border-radius: 8px; background: none; font-size: 17px; line-height: 1; }
  .pnav .arrows button:hover:not(:disabled) { background: var(--hover); } .pnav .arrows button:disabled { opacity: .4; cursor: default; }
  .sthead { display: grid; gap: 4px; } .sthead h3 { font-size: 19px; line-height: 1.25; font-weight: 650; } .sub { color: var(--muted); font-size: 13.5px; }
  .pane ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .note { border-left: 2px solid var(--line2); padding: 2px 0 2px 12px; color: var(--fg); display: grid; gap: 4px; } .note b { font-weight: 600; }
  .trigc { display: grid; gap: 8px; } .trigc .t { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline; } .trigc .t > span:first-child { color: var(--muted); font-size: 13px; }
  mark { background: var(--accent-bg); color: var(--fg); border-radius: 4px; padding: 0 3px; font-family: var(--font-mono); font-size: 12.5px; }
  .ph { border: 1px dashed var(--line2); border-radius: 4px; padding: 0 3px; font-family: var(--font-mono); font-size: 12.5px; }
  .pchips { display: flex; flex-wrap: wrap; gap: 6px; } .pchips button { border: 1px solid var(--line2); background: none; border-radius: 6px; padding: 2px 8px; font-family: var(--font-mono); font-size: 12.5px; }
  textarea, input[type="text"] { width: 100%; font: inherit; background: var(--surface); color: var(--fg); border: 1px solid var(--line2); border-radius: 8px; padding: 9px 10px; } textarea { min-height: 72px; resize: vertical; }
  .field { display: grid; gap: 4px; } .field.hl label { color: var(--accent-text); }
  .field label { font-weight: 600; font-size: 14px; } .field small { color: var(--muted); font-size: 13px; }
  .used { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--muted); } .used button { background: none; border: 0; padding: 0; color: var(--accent-text); font-size: 13px; font-weight: 550; } .used button:hover { text-decoration: underline; }
  .find { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; } .find:first-child { border-top: 0; padding-top: 0; }
  .frow { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; } .lv { font-weight: 600; font-size: 13px; } .fixed { color: var(--muted); font-size: 13px; margin-left: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; margin-left: auto; } .seg button { background: none; border: 0; padding: 4px 12px; font-size: 13px; font-weight: 550; } .seg button + button { border-left: 1px solid var(--line2); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  pre.tree { margin: 0; font: 12.5px/1.65 var(--font-mono); overflow-x: auto; }
  .folded { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: 13.5px; }

  /* answer bar */
  .bar { position: sticky; bottom: 0; z-index: 5; margin-inline: -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
  .barin { max-width: 1180px; margin-inline: auto; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; } .barin .sum { flex: 1 1 240px; font-size: 13.5px; color: var(--muted); }
  .btn { border: 1px solid var(--line2); background: none; border-radius: 9px; padding: 8px 16px; font-weight: 600; } .btn.primary { background: var(--accent); color: #141413; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  dialog { width: min(540px, calc(100vw - 32px)); border: 1px solid var(--line2); border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); } dialog::backdrop { background: rgba(10, 16, 15, .5); }
  .dlg { padding: 20px; display: grid; gap: 12px; } .dlg h3 { font-size: 18px; } .dlg .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .sent { color: var(--fg); font-weight: 600; } .err { color: var(--fg); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="head">

    <p class="purpose" id="purpose" hidden></p>

  <div class="shell">

</div>
