  .brand { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }

  /* buttons, fields, cards */

  .btn:hover:not([aria-disabled="true"]) { background: var(--hover); } .btn.pri { background: var(--ink); color: var(--on-ink); border-color: var(--ink); } .btn.pri:hover:not([aria-disabled="true"]) { background: var(--ink); opacity: .9; }

  /* chips */

  /* the picked flow */

  .vt { margin-left: auto; display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; } .vt button { background: none; border: 0; padding: 3px 12px; font-size: 13px; font-weight: 550; color: var(--muted); }
  .vt button + button { border-left: 1px solid var(--line2); } .vt button[aria-pressed="true"] { background: var(--sel); color: var(--fg); }
  .need-card { border: 1px solid var(--k-waiting); background: var(--k-waiting-bg); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; } .need-card b { font-size: 16.5px; color: var(--fg); }
  .need-card small { color: var(--muted); font-size: 13.5px; } .need-card .in { background: var(--surface); }
  .shell { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .shell { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; } .side { position: sticky; top: 12px; max-height: calc(100vh - 40px); overflow: auto; } }
  .list { min-width: 0; }

  /* runbook */
  .rb { font-family: "Newsreader", Georgia, serif; max-width: 600px; }

  .rb .st b { font-size: 16.5px; font-weight: 600; line-height: 1.3; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; } .rb .st b .pill { font-family: var(--font-body); font-size: 12px; }

  .rb .nt { margin: 3px 0 0 32px; font-style: italic; color: var(--muted); font-size: 14px; line-height: 1.4; }

  /* overview of all flows */

  .stat b { font-size: 28px; line-height: 1.1; color: var(--k, var(--fg)); } .stat span { color: var(--muted); font-size: 13px; } .stat.need { border-color: var(--k-waiting); }

  .ov-need { display: grid; gap: 8px; } .ov-need .nm, .fcard .nm { font-size: 16.5px; overflow-wrap: anywhere; }
  .need-card.k-blocked, .need-card.k-failed { border-color: var(--k-failed); background: var(--k-failed-bg); }
  .fcards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }

  .seg.k-waiting, .seg.k-blocked { background: var(--k-waiting); box-shadow: 0 0 8px var(--k-waiting); animation: beat 1.2s ease-in-out infinite; } .seg.k-failed { background: var(--k-failed); } .seg.k-paused { background: var(--k-paused); }

  .rb .st.k-pending { opacity: .72; } .rb .st.cur { box-shadow: inset 3px 0 0 var(--k); }

  .vm-e.kid { stroke: var(--k-paused); stroke-width: 2; stroke-dasharray: 5 5; } .vm-e.loop { stroke: var(--vm-muted); stroke-dasharray: 5 6; }
  .vm-ph { position: absolute; left: 12px; right: 32px; box-sizing: border-box; border: 1.5px dashed var(--vm-ph); border-radius: 18px; }
  .vm-ph span { position: absolute; left: 64px; top: 10px; font: 700 11px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--vm-muted); }
  .vm-card { position: absolute; left: 24px; right: 44px; height: 64px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 14px; border-radius: 13px; border: 2px solid var(--c); background: var(--cb); cursor: pointer; --c: var(--vm-pl); --cb: var(--vm-pend); }
