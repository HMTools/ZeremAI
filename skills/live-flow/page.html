<title>ZeremAI Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fragment+Mono&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
  /* Layout: a title and a freshness pill, a row of flow chips, then the picked flow: a needs-you card, the steps (runbook or two lanes), and a side panel with Step, Logs, Memory and Files. Same look as the view-template page, with a status colour on every step. */
  :root {
    --bg: #ffffff; --surface: #ffffff; --fg: #141413; --muted: #6b6a63; --line: #ecebe6; --line2: #d6d4cc; --hover: #f8f7f3; --sel: #fdf0e9;
    --accent: #d97757; --accent-text: #b4532f; --accent-bg: #fdeee6; --ink: #141413; --on-ink: #ffffff;
    --k-waiting: #8a5200; --k-waiting-bg: #fff1d6; --k-running: #1b6e49; --k-running-bg: #e3f3eb; --k-done: #6b6a63; --k-done-bg: #f1f0ec;
    --k-failed: #b3261e; --k-failed-bg: #fdeae8; --k-paused: #5546a8; --k-paused-bg: #eceaf9; --k-pending: #6b6a63; --k-pending-bg: #f6f5f1;
    --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1f1e1d; --surface: #2a2927; --fg: #f0eee6; --muted: #a8a69c; --line: #3a3834; --line2: #55524b; --hover: #32302d; --sel: #3a3834;
    --accent: #e8845f; --accent-text: #e8845f; --accent-bg: #4a2e23; --ink: #f0eee6; --on-ink: #1f1e1d;
    --k-waiting: #f0b84d; --k-waiting-bg: #3d3017; --k-running: #5fd39b; --k-running-bg: #17332a; --k-done: #a8a69c; --k-done-bg: #2f2e2b;
    --k-failed: #ff8a80; --k-failed-bg: #432220; --k-paused: #b3a8ff; --k-paused-bg: #2b2850; --k-pending: #a8a69c; --k-pending-bg: #302f2c; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #1f1e1d; --surface: #2a2927; --fg: #f0eee6; --muted: #a8a69c; --line: #3a3834; --line2: #55524b; --hover: #32302d; --sel: #3a3834;
    --accent: #e8845f; --accent-text: #e8845f; --accent-bg: #4a2e23; --ink: #f0eee6; --on-ink: #1f1e1d;
    --k-waiting: #f0b84d; --k-waiting-bg: #3d3017; --k-running: #5fd39b; --k-running-bg: #17332a; --k-done: #a8a69c; --k-done-bg: #2f2e2b;
    --k-failed: #ff8a80; --k-failed-bg: #432220; --k-paused: #b3a8ff; --k-paused-bg: #2b2850; --k-pending: #a8a69c; --k-pending-bg: #302f2c; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); padding-inline: 16px; padding-block: 24px 40px; }
  .wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 18px; }
  h1, h2, h3, h4, p { margin: 0; } h1 { font-size: 24px; line-height: 1.15; letter-spacing: -.015em; font-weight: 650; } h2 { font-size: 22px; line-height: 1.2; letter-spacing: -.01em; font-weight: 650; text-wrap: balance; }
  h4 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
  button { font: inherit; color: inherit; cursor: pointer; } :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .link { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 550; text-align: left; } .link:hover { text-decoration: underline; }
  .k { color: var(--k); } .k-waiting { --k: var(--k-waiting); --kb: var(--k-waiting-bg); } .k-running { --k: var(--k-running); --kb: var(--k-running-bg); } .k-done { --k: var(--k-done); --kb: var(--k-done-bg); }
  .k-failed { --k: var(--k-failed); --kb: var(--k-failed-bg); } .k-paused { --k: var(--k-paused); --kb: var(--k-paused-bg); } .k-pending { --k: var(--k-pending); --kb: var(--k-pending-bg); }
  .pill { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--kb); color: var(--k); white-space: nowrap; }

  /* top */
  .top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; } .fresh { margin-left: auto; font-size: 13px; font-weight: 600; display: inline-flex; gap: 7px; align-items: center; color: var(--muted); }
  .fresh i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; } .fresh.live { color: var(--k-running); } .fresh.live i { background: var(--k-running); animation: beat 2.4s ease-in-out infinite; }
  .fresh.slow { color: var(--k-waiting); } .fresh.slow i { background: var(--k-waiting); } .fresh.off i { background: transparent; border: 2px solid var(--muted); }
  @keyframes beat { 50% { opacity: .35; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line2); background: var(--surface); border-radius: 12px; padding: 7px 12px; text-align: left; max-width: 100%; min-width: 0; }
  .chip:hover { background: var(--hover); } .chip[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); }
  .chip b { font-weight: 600; overflow-wrap: anywhere; } .chip .w { font-size: 12.5px; color: var(--k); font-weight: 600; } .chip .sy { color: var(--k); }
  .chip.need { border-color: var(--k); }

  /* the picked flow */
  .fhead { display: grid; gap: 6px; } .facts { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .vt { margin-left: auto; display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; } .vt button { background: none; border: 0; padding: 3px 12px; font-size: 13px; font-weight: 550; color: var(--muted); }
  .vt button + button { border-left: 1px solid var(--line2); } .vt button[aria-pressed="true"] { background: var(--sel); color: var(--fg); }
  .need-card { border: 1px solid var(--k-waiting); background: var(--k-waiting-bg); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; } .need-card b { font-size: 16.5px; color: var(--fg); }
  .need-card .row2 { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; color: var(--fg); } .need-card small { color: var(--muted); font-size: 13.5px; }
  .shell { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .shell { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; } .side { position: sticky; top: 12px; max-height: calc(100vh - 40px); overflow: auto; } }
  .list { min-width: 0; }

  /* runbook */
  .rb { font-family: "Newsreader", Georgia, serif; max-width: 600px; }
  .rb .part { margin: 22px 0 2px; font: 700 11px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); border-bottom: 1px solid var(--ink); padding-bottom: 6px; } .rb .part:first-child { margin-top: 0; }
  .rb .st { display: grid; grid-template-columns: 32px minmax(0, 1fr); padding: 8px 10px 3px 0; cursor: pointer; border-radius: 8px; } .rb .st:hover { background: var(--hover); } .rb .st[aria-pressed="true"] { background: var(--sel); }
  .rb .no { text-align: right; padding-right: 10px; font-size: 16px; line-height: 1.4; color: var(--k); font-family: var(--font-body); }
  .rb .st b { font-size: 16.5px; font-weight: 600; line-height: 1.3; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; } .rb .st b .pill { font-family: var(--font-body); font-size: 12px; }
  .rb .st p { font-size: 14.5px; line-height: 1.4; color: var(--muted); margin-top: 1px; }
  .rb .stop { margin: 5px 0 2px 32px; border: 1px solid var(--accent-text); color: var(--accent-text); padding: 3px 9px; font: 700 10.5px var(--font-body); letter-spacing: .06em; text-transform: uppercase; display: inline-block; }
  .rb .nt { margin: 3px 0 0 32px; font-style: italic; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .rb .nt button { font: inherit; font-style: italic; background: none; border: 0; padding: 0; color: var(--accent-text); text-decoration: underline; cursor: pointer; }
  /* two lanes */
  .lanes { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 10px 6px 4px; overflow-x: auto; } .lanes svg { display: block; width: 100%; min-width: 560px; height: auto; }
  .lp { cursor: pointer; } .lp rect { fill: var(--surface); stroke: var(--line2); stroke-width: 1.4; } .lp.you rect { fill: var(--accent-bg); stroke: var(--accent); } .lp:hover rect { stroke: var(--muted); }
  .lp.k-waiting rect, .lp.k-failed rect, .lp.k-paused rect { stroke: var(--k); stroke-width: 2.2; } .lp.k-running rect { stroke: var(--k); } .lp.k-done { opacity: .75; }
  .lp.sel rect { stroke: var(--accent); stroke-width: 2.8; } .lp:focus-visible rect { stroke: var(--accent); stroke-width: 2.8; }
  .lp text { fill: var(--fg); font-family: var(--font-body); font-size: 13.5px; font-weight: 600; } .lp text.lnu { fill: var(--muted); font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; } .lp text.lsy { fill: var(--k); font-size: 14px; }
  .lnt { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; } .lph { fill: var(--muted); font-family: var(--font-body); font-size: 12px; font-weight: 600; }
  .lw { fill: none; stroke: var(--line2); stroke-width: 1.4; } .lw.you { stroke: var(--accent); opacity: .7; } .lmid { stroke: var(--line); stroke-dasharray: 3 5; }
  .lhd { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; } .lhd.c { fill: var(--muted); } .lhd.u { fill: var(--accent-text); }
  .flash { animation: flash 2.6s ease-out; } .lp.flash rect { animation: flashr 2.6s ease-out; }
  @keyframes flash { 0%, 25% { background: var(--accent-bg); box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 2px transparent; } }
  @keyframes flashr { 0%, 25% { stroke: var(--accent); stroke-width: 4; } }

  /* side panel */
  .side { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 10px; gap: 4px; overflow-x: auto; }
  .tabs button { background: none; border: 0; padding: 14px 8px 11px; font-weight: 550; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .pane { padding: 18px; display: grid; gap: 16px; min-width: 0; } .pane > * { min-width: 0; }
  .pnav { display: flex; align-items: center; gap: 8px; } .pnav .arrows { margin-left: auto; display: inline-flex; gap: 4px; }
  .pnav .arrows button { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line2); border-radius: 8px; background: none; font-size: 17px; line-height: 1; }
  .pnav .arrows button:hover:not(:disabled) { background: var(--hover); } .pnav .arrows button:disabled { opacity: .4; cursor: default; }
  .sthead { display: grid; gap: 6px; } .sthead h3 { font-size: 19px; line-height: 1.25; font-weight: 650; overflow-wrap: anywhere; } .sub { color: var(--muted); font-size: 13.5px; }
  .pane ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; } .pane li { overflow-wrap: anywhere; }
  .note { border-left: 2px solid var(--line2); padding: 2px 0 2px 12px; display: grid; gap: 4px; } .note.warn { border-left-color: var(--k-failed); } .note b { font-weight: 600; }
  .lg, .tp { border-top: 1px solid var(--line); padding-top: 10px; } .lg:first-child, .tp:first-child { border-top: 0; padding-top: 0; }
  details > summary { cursor: pointer; font-weight: 600; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; } details > summary .sub { font-weight: 400; } details[open] > summary { margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 2px 12px; margin: 0; font-size: 14px; } .kv dt { color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .ent { display: grid; gap: 6px; padding: 8px 0 8px 12px; border-left: 2px solid var(--line2); margin-bottom: 6px; }
  pre.df { margin: 0; font: 12.5px/1.6 var(--font-mono); overflow-x: auto; background: var(--hover); border-radius: 8px; padding: 8px 10px; } .df .a { color: var(--k-running); } .df .d { color: var(--k-failed); } .df .c { color: var(--k-waiting); }
  .frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; } .frow:first-child { border-top: 0; } .frow .mono { overflow-wrap: anywhere; }
  .empty { border: 1px dashed var(--line2); border-radius: 14px; padding: 36px 20px; text-align: center; display: grid; gap: 8px; justify-items: center; } .empty h2 { font-size: 20px; }
  .none { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top"><h1>ZeremAI flows</h1><span class="fresh" id="fresh" role="group" aria-label="Data freshness"><i aria-hidden="true"></i><span id="freshTx">Connecting…</span></span></header>
  <nav class="chips" id="chips" aria-label="Flows" hidden></nav>
  <main id="main"></main>
  <div class="sr" id="say" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';
  /* ---- the six states: same symbols and words as hooks/infra/flow-pane/status-look.ts ---- */
  var LOOK = { waiting: ['▲', 'waits for you'], running: ['●', 'running'], done: ['✓', 'done'], failed: ['✕', 'failed'], paused: ['‖', 'paused'], pending: ['○', 'pending'] };
  var NEEDS = { waiting: 1, failed: 1, paused: 1 };
  var $ = function (id) { return document.getElementById(id); };
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === 'string' ? x : x == null ? '' : typeof x === 'object' ? JSON.stringify(x) : String(x); }
  function kind(x) { return LOOK[x] ? x : 'pending'; }
  function el(tag, attrs) {
    var e = document.createElement(tag), k, kids = Array.prototype.slice.call(arguments, 2);
    for (k in attrs || {}) { var v = attrs[k]; if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k.slice(0, 2) === 'on') e[k] = v; else e.setAttribute(k, v === true ? '' : v); }
    (function add(list) { list.forEach(function (c) { if (Array.isArray(c)) return add(c); if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); }); })(kids);
    return e;
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function ms(iso) { var t = Date.parse(iso); return isNaN(t) ? null : t; }
  function hhmm(t) { return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function ago(t) { var s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + ' s ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; }
  function pill(k) { k = kind(k); return el('span', { class: 'pill k-' + k }, LOOK[k][0], ' ', LOOK[k][1]); }

  /* ---- state ---- */
  var PREVIEW = /preview=1/.test(location.search) || location.hash === '#preview';
  var S = { flows: {}, details: {}, beat: null, ready: false, offline: !navigator.onLine, owner: false, detailsBad: false, noDb: false,
    sel: store('zf-flow'), stepSel: {}, view: store('zf-view') || (window.innerWidth < 720 ? 'runbook' : 'lanes'), tab: 'step', flash: {} };
  var say = function (t) { $('say').textContent = t; };

  /* ---- data in: one subscription each, never from render ---- */
  function flowDoc(id, d) {
    var steps = arr(d.steps).map(function (s) { s = s || {}; return { id: str(s.id), number: s.number, name: str(s.name), phase: str(s.phase), status: kind(s.status), approval: !!s.approval, loopBackTo: s.loopBackTo == null ? '' : str(s.loopBackTo), childFlowId: str(s.childFlowId), summary: str(s.summary) }; });
    var n = d.needsYou && typeof d.needsYou === 'object' ? d.needsYou : null;
    return { id: id, name: str(d.name) || id, template: str(d.template), status: kind(d.status), activeStepId: str(d.activeStepId), updatedAt: ms(d.updatedAt), parentFlowId: str(d.parentFlowId), counts: d.counts || {}, steps: steps,
      needsYou: n ? { stepId: str(n.stepId), stepNumber: n.stepNumber, stepName: str(n.stepName), waitsFor: str(n.waitsFor), since: ms(n.since) } : null };
  }
  function takeFlows(docs) {
    var next = {};
    docs.forEach(function (d) {
      var f = flowDoc(d.id, d.data() || {}), old = S.flows[d.id];
      next[d.id] = f;
      if (!old || !S.ready) return;
      f.steps.forEach(function (s) {
        var o = old.steps.filter(function (x) { return x.id === s.id; })[0];
        if (o && o.status !== s.status) { S.flash[d.id + ':' + s.id] = 1; say(f.name + ', step ' + s.number + ' ' + s.name + ': ' + LOOK[s.status][1]); }
      });
      if (old.status !== f.status) { S.flash[d.id] = 1; if (NEEDS[f.status]) say(f.name + ' ' + LOOK[f.status][1]); }
    });
    S.flows = next; S.ready = true;
    setTimeout(function () { S.flash = {}; }, 2700);
    render();
  }
  function connect(db) {
    db.collection('flows').onSnapshot(function (q) { S.offline = false; takeFlows(q.docs); }, function () { S.offline = true; S.ready = true; render(); });
    db.collection('details').onSnapshot(function (q) { var m = {}; q.docs.forEach(function (d) { m[d.id] = d.data() || {}; }); S.details = m; render(); }, function () { S.detailsBad = true; render(); });
    db.doc('meta/mod').onSnapshot(function (d) { var v = d.data(); S.beat = v ? ms(v.beat) : null; renderFresh(); }, function () {});
  }
  window.addEventListener('offline', function () { S.offline = true; renderFresh(); });
  window.addEventListener('online', function () { S.offline = false; renderFresh(); });

  /* ---- helpers on the data ---- */
  function ordered() {
    var rank = function (f) { return NEEDS[f.status] ? 0 : f.status === 'running' ? 1 : f.status === 'pending' ? 2 : 3; };
    return Object.keys(S.flows).map(function (k) { return S.flows[k]; }).sort(function (a, b) { return rank(a) - rank(b) || (b.updatedAt || 0) - (a.updatedAt || 0) || a.name.localeCompare(b.name); });
  }
  function current(list) { return S.flows[S.sel] || list[0]; }
  function activeIdx(f) {
    var i = f.steps.map(function (s) { return s.id; }).indexOf(S.stepSel[f.id] || '');
    if (i >= 0) return i;
    i = f.steps.map(function (s) { return s.id; }).indexOf(f.activeStepId);
    if (i >= 0) return i;
    for (i = 0; i < f.steps.length; i++) if (f.steps[i].status !== 'done') return i;
    return Math.max(0, f.steps.length - 1);
  }
  function stepNo(f) { var i = f.steps.map(function (s) { return s.id; }).indexOf(f.activeStepId); if (i < 0) i = f.steps.filter(function (s) { return s.status === 'done'; }).length; return Math.min(f.steps.length, i + 1); }
  function showDetails() { return !S.detailsBad && (S.owner || Object.keys(S.details).length > 0); }
  function det(f, kindName) { return S.details[f.id + '~' + kindName]; }
  function pick(f, id, tab) { S.sel = f.id; store('zf-flow', f.id); S.stepSel[f.id] = id; if (tab) S.tab = tab; render(); }

  /* ---- freshness: from the heartbeat, checked on a timer, never written ---- */
  function lastChange() { var m = null; Object.keys(S.flows).forEach(function (k) { var t = S.flows[k].updatedAt; if (t && (!m || t > m)) m = t; }); return m; }
  function renderFresh() {
    var box = $('fresh'), tx = $('freshTx'), cls = '', text, last = lastChange(), ref = S.beat || last;
    if (S.noDb) { box.className = 'fresh off'; tx.textContent = 'No page database'; return; }
    if (S.offline) { cls = 'off'; text = 'Offline. This is the last data it got.'; }
    else if (!S.ready) text = 'Connecting…';
    else if (!ref) text = 'Waiting for ZeremAI';
    else {
      var age = (Date.now() - ref) / 1000;
      if (age < 60) { cls = 'live'; text = 'Live' + (last ? ' · last change ' + ago(last) : ''); }
      else if (age < 180) { cls = 'slow'; text = 'Updating…'; }
      else { cls = 'off'; text = 'Paused. The session may be closed.' + (last ? ' Last change at ' + hhmm(last) + '.' : ''); }
    }
    box.className = 'fresh ' + cls; tx.textContent = text;
  }
  setInterval(renderFresh, 10000);

  /* ---- render ---- */
  var SVGNS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs) {
