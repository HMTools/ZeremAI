<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#flowGradient)"/>
  
  <!-- Flow icon - three connected nodes -->
  <circle cx="30" cy="35" r="8" fill="white" opacity="0.9"/>
  <circle cx="70" cy="35" r="8" fill="white" opacity="0.9"/>
  <circle cx="50" cy="70" r="8" fill="white" opacity="0.9"/>
  
  <!-- Connecting lines -->
  <line x1="36" y1="40" x2="45" y2="63" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="64" y1="40" x2="55" y2="63" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="38" y1="35" x2="62" y2="35" stroke="white" stroke-width="3" opacity="0.7"/>
  
  <!-- Arrow heads suggesting flow -->
  <polygon points="50,62 46,68 54,68" fill="white" opacity="0.9"/>
</svg>
