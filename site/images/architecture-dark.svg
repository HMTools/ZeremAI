<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">ZeremAI architecture</title>
  <desc id="d">You send a prompt to Claude Code. Inside it the agent makes a Bash call to the mod. The mod runs the flow script, which writes the files. The mod reads the files and never writes them.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E2E8F0"/></marker>
  </defs>
  <rect x="140" y="40" width="340" height="220" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="156" y="66" font-size="13" font-weight="600" fill="#E2E8F0">Claude Code</text>

  <rect x="20" y="120" width="92" height="50" rx="25" fill="#7C3AED"/>
  <text x="66" y="150" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">You</text>
  <rect x="165" y="120" width="112" height="50" rx="10" fill="#475569"/>
  <text x="221" y="150" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Agent</text>
  <rect x="345" y="120" width="112" height="50" rx="10" fill="#6366F1"/>
  <text x="401" y="143" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Mod</text>
  <text x="401" y="160" font-size="11" fill="#E0E7FF" text-anchor="middle">hooks/</text>
  <rect x="550" y="50" width="130" height="50" rx="10" fill="#0F766E"/>
  <text x="615" y="73" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Flow script</text>
  <text x="615" y="90" font-size="11" fill="#CCFBF1" text-anchor="middle">Python</text>
  <rect x="550" y="200" width="130" height="50" rx="10" fill="#64748B"/>
  <text x="615" y="223" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Files</text>
  <text x="615" y="240" font-size="11" fill="#E2E8F0" text-anchor="middle">~/.claude/zeremai</text>

  <path d="M112 145 L140 145 L165 145" fill="none" stroke="#E2E8F0" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="126" y="136" font-size="11" fill="#E2E8F0" text-anchor="middle">prompt</text>
  <path d="M277 145 L345 145" fill="none" stroke="#E2E8F0" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="311" y="136" font-size="11" fill="#E2E8F0" text-anchor="middle">Bash call</text>
  <path d="M457 135 L505 135 L505 75 L550 75" fill="none" stroke="#E2E8F0" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="512" y="112" font-size="11" fill="#E2E8F0">runs</text>
  <path d="M615 100 L615 200" fill="none" stroke="#E2E8F0" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="624" y="155" font-size="11" fill="#E2E8F0">writes</text>
  <path d="M457 155 L505 155 L505 225 L550 225" fill="none" stroke="#E2E8F0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="512" y="190" font-size="11" fill="#E2E8F0">reads only</text>
</svg>
