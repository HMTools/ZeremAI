<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeremAI — Roadmap</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface-hover: #222636;
  --border: #2a2e3d;
  --text: #e4e6ef;
  --text-muted: #8b8fa3;
  --accent: #6c63ff;
  --accent-glow: rgba(108,99,255,0.15);
  --critical: #ff4d6a;
  --high: #ff8c42;
  --medium: #4dacff;
  --low: #6b7280;
  --status-done: #34d399;
  --status-progress: #60a5fa;
  --status-accepted: #f59e0b;
  --status-proposed: #a78bfa;
  --status-deferred: #6b7280;
  --status-cancelled: #ef4444;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

/* Header */
.header {
  text-align: center;
  padding: 3rem 0 2rem;
  position: relative;
}
.header h1 {
  font-size: 2.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, #6c63ff, #a78bfa, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}
.header .subtitle {
  color: var(--text-muted);
  font-size: 1.1rem;
}
.generated-date {
  color: var(--text-muted);
  font-size: 0.8rem;
  margin-top: 0.5rem;
}

/* Stats bar */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  margin: 2rem 0;
  flex-wrap: wrap;
}
.stat-chip {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.9rem;
}
.stat-chip .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.stat-chip .count {
  font-weight: 700;
  font-size: 1.1rem;
}

/* Progress bar */
.progress-container {
  max-width: 600px;
  margin: 1.5rem auto;
}
.progress-bar {
  height: 8px;
  background: var(--surface);
  border-radius: 4px;
  overflow: hidden;
  display: flex;
}
.progress-segment {
  height: 100%;
  transition: width 0.5s ease;
}

/* Controls */
.controls {
  display: flex;
  gap: 1rem;
  margin: 2rem 0;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 250px;
  padding: 0.7rem 1rem 0.7rem 2.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--accent); }
.search-wrapper {
  position: relative;
  flex: 1;
  min-width: 250px;
}
.search-wrapper::before {
  content: "🔍";
  position: absolute;
  left: 0.8rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.9rem;
}
.filter-group {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 0.5rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}

/* View toggle */
.view-toggle {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.view-btn {
  padding: 0.5rem 1rem;
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}
.view-btn.active {
  background: var(--accent);
  color: #fff;
}

/* Category sections */
.category-section {
  margin: 2rem 0;
}
.category-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}
.category-header h2 {
  font-size: 1.4rem;
  font-weight: 600;
}
.category-count {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 0.2rem 0.7rem;
  border-radius: 999px;
  font-size: 0.8rem;
  color: var(--text-muted);
}
.category-progress {
  flex: 1;
  max-width: 200px;
  height: 4px;
  background: var(--surface);
  border-radius: 2px;
  overflow: hidden;
}
.category-progress-fill {
  height: 100%;
  background: var(--status-done);
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* Cards grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 1rem;
}

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
}
.card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.card.priority-critical { border-left: 4px solid var(--critical); }
.card.priority-high { border-left: 4px solid var(--high); }
.card.priority-medium { border-left: 4px solid var(--medium); }
.card.priority-low { border-left: 4px solid var(--low); }

.card-illustration {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(108,99,255,0.08), rgba(96,165,250,0.08));
  padding: 1rem;
  overflow: hidden;
}
.card-illustration svg {
  width: 100%;
  height: 100%;
  max-width: 200px;
}

.card-body { padding: 1rem 1.25rem; }
.card-top {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
}
.card-id {
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  font-size: 0.75rem;
  color: var(--text-muted);
}
.status-chip {
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.status-done { background: rgba(52,211,153,0.15); color: var(--status-done); }
.status-in-progress { background: rgba(96,165,250,0.15); color: var(--status-progress); }
.status-accepted { background: rgba(245,158,11,0.15); color: var(--status-accepted); }
.status-proposed { background: rgba(167,139,250,0.15); color: var(--status-proposed); }
.status-deferred { background: rgba(107,114,128,0.15); color: var(--status-deferred); }
.status-cancelled { background: rgba(239,68,68,0.15); color: var(--status-cancelled); }

.priority-badge {
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  margin-left: auto;
}
.badge-critical { background: rgba(255,77,106,0.15); color: var(--critical); }
.badge-high { background: rgba(255,140,66,0.15); color: var(--high); }
.badge-medium { background: rgba(77,172,255,0.15); color: var(--medium); }
.badge-low { background: rgba(107,114,128,0.15); color: var(--low); }

.card-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  line-height: 1.4;
}
.card-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tags {
  display: flex;
  gap: 0.35rem;
  flex-wrap: wrap;
  margin-top: 0.75rem;
}
.tag {
  padding: 0.1rem 0.5rem;
  background: rgba(108,99,255,0.1);
  border-radius: 4px;
  font-size: 0.7rem;
  color: var(--accent);
}

/* Expanded card details */
.card-details {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.card.expanded .card-details { max-height: 600px; }
.card-details-inner {
  padding: 0 1.25rem 1.25rem;
  border-top: 1px solid var(--border);
  margin-top: 0.75rem;
  padding-top: 0.75rem;
}
.detail-row {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 0.4rem;
  font-size: 0.85rem;
}
.detail-label {
  color: var(--text-muted);
  min-width: 100px;
}
.detail-value { color: var(--text); }
.criteria-list {
  list-style: none;
  padding: 0;
}
.criteria-list li {
  padding: 0.2rem 0;
  font-size: 0.85rem;
  color: var(--text);
}
.criteria-list li::before {
  content: "✓ ";
  color: var(--status-done);
}

/* Archive section */
.archive-section {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
}
.archive-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 0.9rem;
  background: none;
  border: none;
  padding: 0.5rem 0;
}
.archive-toggle:hover { color: var(--text); }
.archive-items {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease;
}
.archive-items.open { max-height: 2000px; }

/* Status group headers */
.status-group-header {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 1.5rem 0 0.75rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}
.status-group-header:first-child { margin-top: 0; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}
.empty-state svg { width: 80px; height: 80px; margin-bottom: 1rem; opacity: 0.5; }

/* No results */
.no-results {
  text-align: center;
  padding: 3rem;
  color: var(--text-muted);
  display: none;
}

/* ── Focus Modal ────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 90vw;
  max-width: 720px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  transform: translateY(20px) scale(0.97);
  transition: transform 0.3s ease;
  position: relative;
}
.modal-overlay.open .modal {
  transform: translateY(0) scale(1);
}
.modal-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: all 0.2s;
}
.modal-close:hover { color: var(--text); border-color: var(--accent); }
.modal-illustration {
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(108,99,255,0.1), rgba(96,165,250,0.1));
  border-radius: 16px 16px 0 0;
  padding: 2rem;
}
.modal-illustration svg {
  width: 100%;
  height: 100%;
  max-width: 340px;
}
.modal-body {
  padding: 1.75rem 2rem 2rem;
}
.modal-header {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.modal-id {
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  font-size: 0.85rem;
  color: var(--text-muted);
  background: var(--bg);
  padding: 0.2rem 0.6rem;
  border-radius: 6px;
}
.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 0.75rem;
}
.modal-badges {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.modal-badges .status-chip { font-size: 0.8rem; padding: 0.25rem 0.7rem; }
.modal-badges .priority-badge { font-size: 0.75rem; padding: 0.25rem 0.6rem; }
.modal-type-badge {
  padding: 0.25rem 0.7rem;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  background: rgba(108,99,255,0.1);
  color: var(--accent);
}
.modal-desc {
  font-size: 1rem;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 1.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
.modal-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem 2rem;
  margin-bottom: 1.5rem;
}
.modal-detail {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.modal-detail-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 600;
}
.modal-detail-value {
  font-size: 0.95rem;
  color: var(--text);
}
.modal-criteria {
  margin-top: 1.25rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
}
.modal-criteria h4 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}
.modal-criteria li {
  padding: 0.35rem 0;
  font-size: 0.95rem;
  list-style: none;
}
.modal-criteria li::before {
  content: "✓ ";
  color: var(--status-done);
  font-weight: 700;
}
.modal-notes {
  margin-top: 1.25rem;
  padding: 1rem;
  background: var(--bg);
  border-radius: 8px;
  font-size: 0.9rem;
  color: var(--text-muted);
  line-height: 1.6;
}
.modal-notes-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 0.4rem;
}
.modal-tags {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-top: 1.25rem;
}
.modal-tags .tag { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
.modal-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  border-top: 1px solid var(--border);
  background: var(--bg);
  border-radius: 0 0 16px 16px;
}
.modal-nav-btn {
  padding: 0.5rem 1.2rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.modal-nav-btn:hover { border-color: var(--accent); color: var(--text); }
.modal-nav-btn:disabled { opacity: 0.3; cursor: default; }
.modal-nav-btn:disabled:hover { border-color: var(--border); color: var(--text-muted); }
.modal-nav-counter {
  font-size: 0.8rem;
  color: var(--text-muted);
}
.modal-nav-hint {
  font-size: 0.7rem;
  color: var(--text-muted);
  opacity: 0.6;
}
.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.9rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-left: auto;
  white-space: nowrap;
}
.copy-btn:hover { border-color: var(--accent); color: var(--text); }
.copy-btn.copied {
  border-color: var(--status-done);
  color: var(--status-done);
  background: rgba(52,211,153,0.08);
}

@media (max-width: 768px) {
  .container { padding: 1rem; }
  .header h1 { font-size: 1.8rem; }
  .cards-grid { grid-template-columns: 1fr; }
  .controls { flex-direction: column; }
  .stats-bar { gap: 0.75rem; }
  .modal { width: 95vw; max-height: 95vh; }
  .modal-illustration { height: 160px; }
  .modal-body { padding: 1.25rem 1.5rem; }
  .modal-details { grid-template-columns: 1fr; }
  .modal-title { font-size: 1.2rem; }
}
</style>
</head>

<div class="container">
  <div class="header">
    <h1>ZeremAI</h1>
    <div class="subtitle">Product Roadmap</div>
    <div class="generated-date" id="genDate"></div>
  </div>

  <div class="stats-bar" id="statsBar"></div>
  <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

  <div class="controls">
    <div class="search-wrapper">
      <input type="text" class="search-box" id="searchBox" placeholder="Search items...">
    </div>
    <div class="view-toggle">
      <button class="view-btn active" data-view="category">By Category</button>
      <button class="view-btn" data-view="status">By Status</button>
      <button class="view-btn" data-view="milestone">By Milestone</button>
    </div>
  </div>

  <div class="controls">
    <div class="filter-group" id="statusFilters"></div>
    <div class="filter-group" id="typeFilters"></div>
    <div class="filter-group" id="priorityFilters"></div>
  </div>

  <div id="content"></div>

  <div class="no-results" id="noResults">
    <p>No items match your filters.</p>
  </div>

  <div class="archive-section" id="archiveSection" style="display:none">
    <button class="archive-toggle" id="archiveToggle">
      <span id="archiveArrow">▶</span> <span id="archiveLabel">Archived items</span>
    </button>
    <div class="archive-items" id="archiveItems">
      <div class="cards-grid" id="archiveGrid"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-illustration" id="modalIllustration"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-nav">
      <button class="modal-nav-btn" id="modalPrev"><span>&#8592;</span> Previous</button>
      <div style="text-align:center">
        <div class="modal-nav-counter" id="modalCounter"></div>
        <div class="modal-nav-hint">Arrow keys to navigate &middot; Esc to close</div>
      </div>
      <button class="modal-nav-btn" id="modalNext">Next <span>&#8594;</span></button>
    </div>
  </div>
</div>

const TYPE_FALLBACKS = {
  "feature": "deploy-rocket", "improvement": "config-settings", "bug": "debug-bug",
  "idea": "brain-learning", "documentation": "file-document", "infrastructure": "plugin-blocks"
};

let currentView = "category";
let activeStatusFilters = new Set();
let activeTypeFilters = new Set();
let activePriorityFilters = new Set();
let searchQuery = "";

function getIllustration(item) {
  const key = item.illustration || TYPE_FALLBACKS[item.type] || "default";
  return ILLUSTRATIONS[key] || ILLUSTRATIONS["default"];
}

function matchesFilters(item) {
  if (activeStatusFilters.size && !activeStatusFilters.has(item.status)) return false;
  if (activeTypeFilters.size && !activeTypeFilters.has(item.type)) return false;
  if (activePriorityFilters.size && !activePriorityFilters.has(item.priority)) return false;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const haystack = [item.title, item.description, item.id, ...(item.tags || []), item.category, item.notes].join(" ").toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

let visibleItems = [];
let currentModalIndex = -1;

function renderCard(item, isArchived) {
  const statusClass = `status-${item.status}`;
  const priorityClass = `priority-${item.priority}`;
  const badgeClass = `badge-${item.priority}`;
  const tags = (item.tags || []).filter(t => t).map(t => `<span class="tag">${esc(t)}</span>`).join("");

  return `<div class="card ${priorityClass}" data-id="${esc(item.id)}">
    <div class="card-illustration">${getIllustration(item)}</div>
    <div class="card-body">
      <div class="card-top">
        <span class="card-id">${esc(item.id)}</span>
        <span class="status-chip ${statusClass}">${esc(item.status)}</span>
        <span class="priority-badge ${badgeClass}">${esc(item.priority)}</span>
      </div>
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-desc">${esc(item.description)}</div>
      ${tags ? `<div class="card-tags">${tags}</div>` : ""}
    </div>
  </div>`;
}

function openModal(index) {
  if (index < 0 || index >= visibleItems.length) return;
  currentModalIndex = index;
  const item = visibleItems[index];
  const overlay = document.getElementById("modalOverlay");
  document.getElementById("modalIllustration").innerHTML = getIllustration(item);
  const statusClass = `status-${item.status}`;
  const badgeClass = `badge-${item.priority}`;
  const criteria = (item.acceptance_criteria || []).filter(c => c);
  const tags = (item.tags || []).filter(t => t);
  const deps = (item.dependencies || []).filter(d => d);

  let details = "";
  const fields = [
    ["Category", item.category], ["Milestone", item.milestone],
    ["Effort", item.effort], ["Author", item.author],
    ["Created", item.created], ["Updated", item.updated]
  ];
  for (const [label, value] of fields) {
    if (value) details += `<div class="modal-detail"><span class="modal-detail-label">${label}</span><span class="modal-detail-value">${esc(value)}</span></div>`;
  }
  if (deps.length) details += `<div class="modal-detail"><span class="modal-detail-label">Dependencies</span><span class="modal-detail-value">${deps.map(esc).join(", ")}</span></div>`;

  let html = `
    <div class="modal-header">
      <span class="modal-id">${esc(item.id)}</span>
    </div>
    <div class="modal-title">${esc(item.title)}</div>
    <div class="modal-badges">
      <span class="status-chip ${statusClass}">${esc(item.status)}</span>
      <span class="priority-badge ${badgeClass}">${esc(item.priority)}</span>
      <span class="modal-type-badge">${esc(item.type)}</span>
    </div>
    <div class="modal-desc">
      ${esc(item.description)}
      <button class="copy-btn" onclick="event.stopPropagation(); copyItemPrompt('${esc(item.id)}')">
        <span class="copy-btn-icon">&#128203;</span> <span class="copy-btn-text">Copy to agent</span>
      </button>
    </div>
    ${details ? `<div class="modal-details">${details}</div>` : ""}
    ${criteria.length ? `<div class="modal-criteria"><h4>Acceptance Criteria</h4><ul>${criteria.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
    ${item.notes ? `<div class="modal-notes"><div class="modal-notes-label">Notes</div>${esc(item.notes)}</div>` : ""}
    ${tags.length ? `<div class="modal-tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
  `;

  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalCounter").textContent = `${index + 1} of ${visibleItems.length}`;
  document.getElementById("modalPrev").disabled = index === 0;
  document.getElementById("modalNext").disabled = index === visibleItems.length - 1;

  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
  currentModalIndex = -1;
}

function navigateModal(dir) {
  const next = currentModalIndex + dir;
  if (next >= 0 && next < visibleItems.length) openModal(next);
}

function copyItemPrompt(id) {
  const item = ROADMAP.items.find(i => i.id === id);
  if (!item) return;
  let text = `[${item.id}] ${item.title}\n\n${item.description}`;
  if (item.category) text += `\nCategory: ${item.category}`;
  if (item.priority) text += `\nPriority: ${item.priority}`;
  if ((item.acceptance_criteria || []).filter(c => c).length) {
    text += `\n\nAcceptance Criteria:\n${item.acceptance_criteria.filter(c => c).map(c => `- ${c}`).join("\n")}`;
  }
  if (item.notes) text += `\n\nNotes: ${item.notes}`;
  if ((item.dependencies || []).filter(d => d).length) {
    text += `\nDepends on: ${item.dependencies.filter(d => d).join(", ")}`;
  }
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector(`.copy-btn`);
    if (btn) {
      btn.classList.add("copied");
      btn.querySelector(".copy-btn-text").textContent = "Copied!";
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.querySelector(".copy-btn-text").textContent = "Copy to agent";
      }, 2000);
    }
  });
}

function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const STATUS_ORDER = {"in-progress":0,"accepted":1,"proposed":2,"deferred":3,"done":4,"cancelled":5};
const PRIORITY_ORDER = {"critical":0,"high":1,"medium":2,"low":3};

function sortItems(items) {
  return [...items].sort((a,b) => {
    const sd = (STATUS_ORDER[a.status]||99) - (STATUS_ORDER[b.status]||99);
    if (sd !== 0) return sd;
    return (PRIORITY_ORDER[a.priority]||99) - (PRIORITY_ORDER[b.priority]||99);
  });
}

function groupBy(items, key) {
  const groups = {};
  for (const item of items) {
    const g = item[key] || "ungrouped";
    (groups[g] = groups[g] || []).push(item);
  }
  return groups;
}

function renderContent() {
  const items = ROADMAP.items.filter(matchesFilters);
  const content = document.getElementById("content");
  const noResults = document.getElementById("noResults");

  visibleItems = [];

  if (!items.length) {
    content.innerHTML = "";
    noResults.style.display = "block";
    return;
  }
  noResults.style.display = "none";

  const groups = groupBy(items, currentView === "category" ? "category" : currentView === "milestone" ? "milestone" : "status");
  let html = "";

  const groupOrder = Object.keys(groups).sort((a, b) => {
    if (currentView === "status") return (STATUS_ORDER[a]||99) - (STATUS_ORDER[b]||99);
    return a.localeCompare(b);
  });

  for (const groupName of groupOrder) {
    const groupItems = sortItems(groups[groupName]);
    visibleItems.push(...groupItems);
    const doneCount = groupItems.filter(i => i.status === "done").length;
    const pct = groupItems.length ? Math.round(doneCount / groupItems.length * 100) : 0;

    html += `<div class="category-section">
      <div class="category-header">
        <h2>${esc(groupName)}</h2>
        <span class="category-count">${groupItems.length} items</span>
        <div class="category-progress"><div class="category-progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="cards-grid">${groupItems.map(i => renderCard(i, false)).join("")}</div>
    </div>`;
  }

  content.innerHTML = html;

  content.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      const id = card.dataset.id;
      const idx = visibleItems.findIndex(i => i.id === id);
      if (idx >= 0) openModal(idx);
    });
  });
}

function renderStats() {
  const items = ROADMAP.items;
  const counts = {};
  for (const item of items) counts[item.status] = (counts[item.status]||0) + 1;

  const statusColors = {
    "done":"var(--status-done)","in-progress":"var(--status-progress)",
    "accepted":"var(--status-accepted)","proposed":"var(--status-proposed)",
    "deferred":"var(--status-deferred)","cancelled":"var(--status-cancelled)"
  };

  const bar = document.getElementById("statsBar");
  bar.innerHTML = Object.entries(counts).sort((a,b) => (STATUS_ORDER[a[0]]||99)-(STATUS_ORDER[b[0]]||99))
    .map(([s,c]) => `<div class="stat-chip"><span class="dot" style="background:${statusColors[s]||'#6b7280'}"></span><span class="count">${c}</span>${s}</div>`).join("");

  const total = items.length || 1;
  const pBar = document.getElementById("progressBar");
  const order = ["done","in-progress","accepted","proposed","deferred","cancelled"];
  pBar.innerHTML = order.filter(s => counts[s]).map(s =>
    `<div class="progress-segment" style="width:${counts[s]/total*100}%;background:${statusColors[s]}"></div>`
  ).join("");
}

function renderFilters() {
  const items = ROADMAP.items;
  const statuses = [...new Set(items.map(i=>i.status))].sort((a,b)=>(STATUS_ORDER[a]||99)-(STATUS_ORDER[b]||99));
  const types = [...new Set(items.map(i=>i.type))].sort();
  const priorities = [...new Set(items.map(i=>i.priority))].sort((a,b)=>(PRIORITY_ORDER[a]||99)-(PRIORITY_ORDER[b]||99));

  document.getElementById("statusFilters").innerHTML = statuses.map(s =>
    `<button class="filter-btn" data-filter="status" data-value="${esc(s)}">${esc(s)}</button>`).join("");
  document.getElementById("typeFilters").innerHTML = types.map(t =>
    `<button class="filter-btn" data-filter="type" data-value="${esc(t)}">${esc(t)}</button>`).join("");
  document.getElementById("priorityFilters").innerHTML = priorities.map(p =>
    `<button class="filter-btn" data-filter="priority" data-value="${esc(p)}">${esc(p)}</button>`).join("");
}

function renderArchive() {
  const archived = ROADMAP.archived || [];
  const section = document.getElementById("archiveSection");
  if (!archived.length) { section.style.display = "none"; return; }
  section.style.display = "block";
  document.getElementById("archiveLabel").textContent = `${archived.length} archived item${archived.length!==1?"s":""}`;
  document.getElementById("archiveGrid").innerHTML = sortItems(archived).map(i => renderCard(i, true)).join("");
}

function init() {
  document.getElementById("genDate").textContent = `Generated: ${new Date(ROADMAP.generated).toLocaleDateString("en-US", {year:"numeric",month:"long",day:"numeric"})}`;
  renderStats();
  renderFilters();
  renderContent();
  renderArchive();

  document.getElementById("searchBox").addEventListener("input", e => { searchQuery = e.target.value; renderContent(); });

  document.querySelectorAll(".view-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentView = btn.dataset.view;
      renderContent();
    });
  });

  document.addEventListener("click", e => {
    if (e.target.classList.contains("filter-btn")) {
      const filterType = e.target.dataset.filter;
      const value = e.target.dataset.value;
      const sets = {status: activeStatusFilters, type: activeTypeFilters, priority: activePriorityFilters};
      const set = sets[filterType];
      if (set.has(value)) { set.delete(value); e.target.classList.remove("active"); }
      else { set.add(value); e.target.classList.add("active"); }
      renderContent();
    }
  });

  document.getElementById("archiveToggle").addEventListener("click", () => {
    const items = document.getElementById("archiveItems");
    const arrow = document.getElementById("archiveArrow");
    items.classList.toggle("open");
    arrow.textContent = items.classList.contains("open") ? "▼" : "▶";
  });

  // Modal controls
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById("modalPrev").addEventListener("click", () => navigateModal(-1));
  document.getElementById("modalNext").addEventListener("click", () => navigateModal(1));

  document.addEventListener("keydown", e => {
    if (currentModalIndex < 0) return;
    if (e.key === "Escape") closeModal();
    else if (e.key === "ArrowLeft") navigateModal(-1);
    else if (e.key === "ArrowRight") navigateModal(1);
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
